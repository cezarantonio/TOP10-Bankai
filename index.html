<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Bankai - Gotei 13</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Bankai por Esquadrão</h1>

    <section class="galeria">
      
      <!-- Cartão de Exemplo 1 -->
      <article class="card">
        <div class="imagem-container">
          <img src="https://via.placeholder.com/400x250" alt="Senbonzakura Kageyoshi - 6º Esquadrão">
        </div>
        <div class="conteudo">
          <span class="badge">6º Esquadrão</span>
          <h2>Senbonzakura Kageyoshi</h2>
          <p>Portador: Byakuya Kuchiki</p>
        </div>
      </article>

      <!-- Cartão de Exemplo 2 -->
      <article class="card">
        <div class="imagem-container">
          <img src="https://via.placeholder.com/400x250" alt="Daiguren Hyourinmaru - 10º Esquadrão">
        </div>
        <div class="conteudo">
          <span class="badge">10º Esquadrão</span>
          <h2>Daiguren Hyourinmaru</h2>
          <p>Portador: Tōshirō Hitsugaya</p>
        </div>
      </article>

    </section>
  </main>

</body>
</html>
