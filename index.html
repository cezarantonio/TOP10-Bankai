<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria de Bankai - Gotei 13</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Bankai por Esquadrão</h1>

    <section class="galeria">
      
      <!-- Cartão de Exemplo 1 -->
      <article class="card">
        <div class="imagem-container">
          <img src="https://static.wikia.nocookie.net/bleach3phantom/images/a/ac/Senbonzakura_Kageyoshi.png/revision/latest?cb=20201208044914" alt="Senbonzakura Kageyoshi - 6º Esquadrão">
        </div>
        <div class="conteudo">
          <span class="badge">6º Esquadrão</span>
          <h2>Senbonzakura Kageyoshi</h2>
          <p>Portador: Byakuya Kuchiki</p>
        </div>
      </article>

      <!-- Cartão de Exemplo 2 -->
      <article class="card">
        <div class="imagem-container">
          <img src="https://static.wikia.nocookie.net/rpg-the-king-of-cartoons-2/images/3/3f/Bankai_Daiguren_Hy%C5%8Drinmaru.png/revision/latest?cb=20200824071052&path-prefix=pt-br" alt="Daiguren Hyourinmaru - 10º Esquadrão">
        </div>
        <div class="conteudo">
          <span class="badge">10º Esquadrão</span>
          <h2>Daiguren Hyourinmaru</h2>
          <p>Portador: Tōshirō Hitsugaya</p>
        </div>
      </article>

      <article class="card">
        <div class="imagem-container">
          <img src="https://us.oricon-group.com/upimg/detail/9000/9151/img660/Kisuke-Urahara-Bankai-Kannonbiraki-Benihime-Aratame.jpg" alt="Kannonbiraki Benihime Aratame - 12º Esquadrão">
        </div>
        <div class="conteudo">
          <span class="badge">12º Esquadrão</span>
          <h2>Kannonbiraki Benihime Aratame</h2>
          <p>Portador: Kisuke Urahara</p>
        </div>
      </article>


    </section>
  </main>

</body>
</html>
